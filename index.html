<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I nostri 70 anni di matrimonio</title>
    <!-- Google Fonts: Playfair Display, Montserrat & Alex Brush -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Alex+Brush&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        butter: {
                            light: '#faf3df',
                            DEFAULT: '#f3e6c4',
                            dark: '#e3cc96',
                            deep: '#cbb074'
                        },
                        gold: {
                            light: '#fff3a8',
                            DEFAULT: '#d4af37',
                            dark: '#aa7c11',
                            deep: '#664600'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        hand: ['"Alex Brush"', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1917;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        /* Effetto Carta Ruvida (Texture Burro) */
        .rough-paper {
            background-color: #f7ebd0;
            background-image: 
                radial-gradient(rgba(120, 90, 40, 0.08) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 0);
            background-size: 8px 8px, 12px 12px;
            background-position: 0 0, 4px 4px;
        }

        /* --- SIGILLO DI CERALACCA REALISTICO FATTO A TIMBRO --- */

        /* 1. Corpo esterno (colata di ceralacca irregolare) */
        .wax-seal-gold {
            background: 
                radial-gradient(circle at 30% 25%, #fff6cd 0%, #e6be53 25%, #c8961d 55%, #8a5a00 80%, #4a2f00 100%);
            border-radius: 42% 58% 49% 51% / 55% 43% 57% 45%;
            box-shadow: 
                inset 1px 2px 3px rgba(255, 255, 255, 0.75),
                inset -2px -3px 5px rgba(0, 0, 0, 0.7),
                2px 6px 15px rgba(0, 0, 0, 0.45),
                0 2px 4px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wax-seal-gold:hover {
            transform: scale(1.06) rotate(3deg);
            box-shadow: 
                inset 2px 3px 4px rgba(255, 255, 255, 0.9),
                inset -3px -4px 7px rgba(0, 0, 0, 0.8),
                3px 10px 22px rgba(0, 0, 0, 0.55);
        }

        /* 2. Solco centrale scavato dal timbro */
        .wax-seal-inner {
            background: 
                radial-gradient(circle at 65% 65%, #fff1b0 0%, #d49f1d 40%, #a17006 75%, #593c00 100%);
            border-radius: 47% 53% 52% 48% / 49% 51% 49% 51%;
            box-shadow: 
                inset 3px 3px 6px rgba(0, 0, 0, 0.75),
                inset -2px -2px 4px rgba(255, 255, 255, 0.4),
                0 1px 2px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(138, 90, 0, 0.5);
        }

        /* 3. Bordo circolare impresso all'interno del solco */
        .seal-stamp-ring {
            border: 2px solid rgba(255, 235, 170, 0.45);
            border-radius: 50%;
            box-shadow: 
                1px 1px 1px rgba(0, 0, 0, 0.6),
                inset 1px 1px 1px rgba(255, 255, 255, 0.5);
        }

        /* 4. Lettere RV in rilievo 3D */
.seal-text-emboss {
    font-style: italic; /* <--- AGGIUNTO QUI */
    background: linear-gradient(135deg, #ffffff 0%, #ffe899 30%, #d49f1d 70%, #8a5a00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(1px 1.5px 1px rgba(0, 0, 0, 0.9)) 
            drop-shadow(-0.5px -0.5px 0.5px rgba(255, 255, 255, 0.6));
}

        /* Animazioni della Busta */
        @keyframes openFlap {
            0% { transform: rotateX(0deg); z-index: 25; }
            50% { z-index: 25; }
            100% { transform: rotateX(180deg); z-index: 5; }
        }

        .flap-open {
            animation: openFlap 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            transform-origin: top;
        }

        /* Gestione Flip Card 3D */
        .card-3d-wrapper {
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back-face {
            transform: rotateY(180deg);
        }

        .card-flipped {
            transform: rotateY(180deg);
        }

        .border-gold-subtle {
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 font-sans antialiased overflow-x-hidden min-h-screen">

    <!-- SCHERMATA PRINCIPALE CON LA BUSTA -->
    <div id="envelope-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#12100e] transition-opacity duration-1000 p-4 select-none">
        
        <!-- Sfondo Ambientale Sfumato -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-40 -left-40 w-96 h-96 bg-gold-dark rounded-full filter blur-[140px] opacity-20"></div>
            <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-butter-deep rounded-full filter blur-[140px] opacity-15"></div>
        </div>

        <!-- Titolo Introduttivo -->
        <div id="intro-titles" class="text-center mb-8 z-10 transition-opacity duration-500">
            <p class="font-sans text-xs sm:text-sm text-stone-400 tracking-widest uppercase">Clicca sul sigillo per aprire l'invito</p>
        </div>

        <!-- Contenitore 3D della Busta -->
        <div id="envelope-container" class="relative w-full max-w-[460px] h-[300px] perspective-1000 z-10 cursor-pointer overflow-visible" onclick="openEnvelope()">
            
            <!-- 1. SFONDO INTERNO DELLA BUSTA -->
            <div class="absolute inset-0 rough-paper rounded-lg shadow-2xl overflow-hidden border border-butter-dark/30 z-0">
                <div class="absolute inset-0 bg-gradient-to-br from-butter-light/40 via-transparent to-butter-deep/30"></div>
            </div>

            <!-- 2. CARTOLINA / INVITO (Inizialmente nascosta dentro la busta) -->
            <div id="env-letter" class="absolute inset-x-4 top-3 bottom-3 z-5 transition-all duration-1000 ease-in-out pointer-events-none">
                <div id="card-inner-3d" class="card-3d-wrapper relative w-full h-full shadow-2xl rounded-lg">
                    
                    <!-- FRONTE CARTOLINA -->
                    <div class="card-face absolute inset-0 bg-[#fdfbf7] rounded-lg p-6 flex flex-col items-center justify-center text-stone-800 border-gold-subtle shadow-inner">
                        <p class="font-hand text-4xl sm:text-5xl text-gold-dark mb-1">Rosa & Vincenzo</p>
                        <div class="w-16 h-[1px] bg-gold-dark/40 my-3"></div>
                        <p class="font-serif tracking-widest uppercase text-xs sm:text-sm text-stone-600">70 Anni di Matrimonio</p>
                        <p class="font-serif italic text-xs text-stone-400 mt-2">Nozze di Ferro</p>

            </div>

            </div>

                 style="clip-path: polygon(0% 0%, 100% 0%, 50% 52%); filter: drop-shadow(0px 5px 7px rgba(0,0,0,0.25));">

            </div>

            <!-- 7. SIGILLO REALISTICO IN CERALACCA DORATA (RV) -->
            <div id="env-seal" class="absolute top-[50%] left-[50%] -translate-x-1/2 -translate-y-[50%] z-30 transition-all duration-500">
                <div class="wax-seal-gold w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center p-2">
                    <div class="wax-seal-inner w-full h-full flex items-center justify-center relative">
                        <div class="seal-stamp-ring absolute inset-1 sm:inset-1.5 flex items-center justify-center pointer-events-none"></div>
                        <span class="seal-text-emboss font-serif font-bold text-xl sm:text-2xl tracking-tight select-none z-10 pt-0.5 pl-0.5">
                            RV
                        <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&display=swap" rel="stylesheet">
                        </span>
                    </div>
                </div>
            </div>

        <div id="intro-footer" class="mt-8 z-10 text-center transition-opacity duration-500">
        </div>

    <script>
        function openEnvelope() {
            const container = document.getElementById('envelope-container');
            container.onclick = null;
            container.style.cursor = 'default';

            // 1. Nascondi testi guida
            document.getElementById('intro-titles').style.opacity = '0';
            document.getElementById('intro-footer').style.opacity = '0';

            // 2. Nascondi il sigillo
            const seal = document.getElementById('env-seal');
            seal.style.opacity = '0';
            seal.style.transform = 'translate(-50%, -50%) scale(0.4)';

            // 3. Apri l'aletta superiore
            setTimeout(() => {
                const flap = document.getElementById('env-top-flap');
                flap.classList.add('flap-open');
                flap.style.filter = 'none';
            }, 300);

            // 4. Sfila la lettera verso l'alto
            const letter = document.getElementById('env-letter');
            setTimeout(() => {
                letter.style.zIndex = '40';
                letter.style.transform = 'translateY(-110%) scale(1.05)';
            }, 1000);

            // 5. Centra e Ruota (Flip) la cartolina 3D
            const cardInner = document.getElementById('card-inner-3d');
            setTimeout(() => {
                if (window.innerWidth <= 768) {
letter.style.transform = 'translateY(-10%) scale(1)';
} else {
letter.style.transform = 'translateY(-20%) scale(1.25)';
}
                cardInner.classList.add('card-flipped');
            }, 2200);
        }
    </script>
