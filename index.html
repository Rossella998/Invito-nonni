<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I nostri 70 anni di matrimonio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --butter-light:#faf3df;
    --butter:#f3e6c4;
    --butter-dark:#e3cc96;
    --butter-deep:#cbb074;
    --gold-light:#fff3a8;
    --gold:#d4af37;
    --gold-dark:#aa7c11;
    --bg:#12100e;
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
    --hand:"Alex Brush","Segoe Script",cursive;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html,body{margin:0;padding:0;height:100%;}

  body{
    background:var(--bg);
    color:#f5f5f4;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- Schermata ---------- */
  #envelope-screen{
    position:fixed;
    inset:0;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(16px,5vh,40px);
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* dvh dove supportato: evita i salti della barra indirizzi su iOS/Android */
  @supports (height:100dvh){ #envelope-screen{height:100dvh;} }

  .glow{
    position:absolute;
    width:min(24rem,80vw);
    aspect-ratio:1;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
  }
  .glow-a{top:-20%;left:-25%;background:var(--gold-dark);opacity:.2;}
  .glow-b{bottom:-20%;right:-25%;background:var(--butter-deep);opacity:.15;}

  #intro-titles,#intro-footer{
    position:relative;
    z-index:2;
    text-align:center;
    transition:opacity .5s ease;
  }
  #intro-titles h2{
    margin:0 0 .5rem;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.1rem,5.5vw,1.875rem);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-light);
  }
  #intro-titles p{
    margin:0;
    font-size:clamp(.65rem,3vw,.875rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#a8a29e;
  }
  #intro-footer p{
    margin:0;
    font-size:clamp(.65rem,3vw,.75rem);
    font-style:italic;
    color:#a8a29e;
  }

  /* ---------- Busta ---------- */
  #envelope-container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:460px;
    aspect-ratio:46/30;
    perspective:1000px;
    touch-action:manipulation;
  }

  .layer{position:absolute;inset:0;overflow:hidden;}

  .rough-paper{
    background-color:#f7ebd0;
    background-image:
      radial-gradient(rgba(120,90,40,.08) 1px,transparent 0),
      radial-gradient(rgba(0,0,0,.05) 1px,transparent 0);
    background-size:8px 8px,12px 12px;
    background-position:0 0,4px 4px;
  }

  #env-back{
    z-index:0;
    border-radius:10px;
    border:1px solid rgba(227,204,150,.3);
    box-shadow:0 20px 45px rgba(0,0,0,.5);
  }
  #env-back::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(250,243,223,.4),transparent 55%,rgba(203,176,116,.3));
  }

  /* Cartolina */
  #env-letter{
    position:absolute;
    left:4%;
    right:4%;
    top:3.5%;
    bottom:3.5%;
    z-index:5;
    perspective:1200px;
    pointer-events:none;
    transition:transform 1s ease-in-out;
  }
  /* La busta si dissolve quando la cartolina è uscita */
  .envelope-gone .layer{
    opacity:0;
    transition:opacity .9s ease;
  }
  #card-inner-3d{
    position:relative;
    width:100%;
    height:100%;
    border-radius:10px;
    transform-style:preserve-3d;
    transition:transform 1.2s cubic-bezier(.4,0,.2,1);
    box-shadow:0 18px 35px rgba(0,0,0,.45),0 0 0 1px rgba(212,175,55,.18);
  }
  .card-face{
    position:absolute;
    inset:0;
    border-radius:10px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .card-front{
    background:#fdfbf7;
    border:1px solid rgba(212,175,55,.4);
    color:#292524;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,4%,24px);
    text-align:center;
  }
  .card-front .names{
    margin:0;
    font-family:var(--hand);
    font-size:clamp(1.75rem,9vw,3rem);
    line-height:1.1;
    color:var(--gold-dark);
  }
  .card-front .rule{
    width:4rem;
    height:1px;
    margin:clamp(8px,3%,14px) 0;
    background:rgba(170,124,17,.4);
  }
  .card-front .years{
    margin:0;
    font-family:var(--serif);
    font-size:clamp(.6rem,2.8vw,.875rem);
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#57534e;
  }
  .card-front .kind{
    margin:.5rem 0 0;
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(.6rem,2.6vw,.75rem);
    color:#a8a29e;
  }
  .card-back{
    transform:rotateY(180deg);
    background:#0c0a09;
    border:1px solid rgba(212,175,55,.3);
  }
  .card-back img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* Alette */
  .flap{z-index:10;}
  #flap-left{clip-path:polygon(0 0,52% 50%,0 100%);border-radius:10px 0 0 10px;}
  #flap-left::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(227,204,150,.3),rgba(243,230,196,.1),transparent);border-right:1px solid rgba(0,0,0,.1);}
  #flap-right{clip-path:polygon(100% 0,48% 50%,100% 100%);border-radius:0 10px 10px 0;}
  #flap-right::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(227,204,150,.3),rgba(243,230,196,.1),transparent);border-left:1px solid rgba(0,0,0,.1);}
  #flap-bottom{
    z-index:15;
    clip-path:polygon(0 100%,100% 100%,50% 48%);
    border-radius:0 0 10px 10px;
  }
  #flap-bottom::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(227,204,150,.4),var(--butter),transparent);border-top:1px solid rgba(0,0,0,.05);}

  #env-top-flap{
    z-index:25;
    clip-path:polygon(0 0,100% 0,50% 52%);
    border-radius:10px 10px 0 0;
    transform-origin:top center;
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.25));
  }
  #env-top-flap::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--butter-light),var(--butter),rgba(227,204,150,.5));}

  @keyframes openFlap{
    0%{transform:rotateX(0deg);z-index:25;}
    50%{z-index:25;}
    100%{transform:rotateX(180deg);z-index:5;}
  }
  .flap-open{animation:openFlap 1s cubic-bezier(.4,0,.2,1) forwards;}

  /* ---------- Sigillo: pulsante reale, cliccabile su ogni dispositivo ---------- */
  #env-seal{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    margin:0;
    padding:0;
    border:0;
    background:none;
    font:inherit;
    color:inherit;
    cursor:pointer;
    display:grid;
    place-items:center;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .5s ease,transform .5s cubic-bezier(.175,.885,.32,1.275);
  }
  #env-seal:focus-visible{outline:2px solid var(--gold-light);outline-offset:6px;border-radius:50%;}

  .seal{
    display:block;
    width:clamp(68px,19.5vw,94px);
    height:auto;
    overflow:visible;
    filter:
      drop-shadow(0 7px 11px rgba(0,0,0,.45))
      drop-shadow(0 1px 2px rgba(0,0,0,.45));
    transition:transform .4s cubic-bezier(.175,.885,.32,1.275);
  }

  @media (hover:hover) and (pointer:fine){
    #env-seal:hover .seal{transform:scale(1.06) rotate(2deg);}
  }
  /* Feedback al tocco, dato che su mobile :hover non esiste */
  #env-seal:active .seal{transform:scale(.94);}

  /* Schermi bassi (paesaggio su telefono) */
  @media (max-height:520px){
    #envelope-screen{gap:12px;}
    #envelope-container{max-width:min(460px,calc(66vh * 1.53));}
  }

  .is-open #env-seal{opacity:0;transform:translate(-50%,-50%) scale(.4);pointer-events:none;}
  .is-open #intro-titles,.is-open #intro-footer{opacity:0;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <div id="intro-titles">
    <h2>Sei invitato</h2>
    <p>Tocca il sigillo per aprire l'invito</p>
  </div>

    <div id="env-back" class="layer rough-paper"></div>

    <!-- Cartolina -->
    <div id="env-letter">
      <div id="card-inner-3d">
        <div class="card-face card-front">
          <p class="names">Rosa &amp; Vincenzo</p>

                  filter="url(#s-groove-blur)">RV</text>
            <!-- fondo del solco: stessa cera, più scura perché la luce vi arriva attenuata -->
            <text x="94" y="109" fill="url(#s-letter)" filter="url(#s-letter-soft)">RV</text>
            <!-- pellicola sottilissima di lucido rimasta sul bordo premuto -->
            <text x="94" y="109" fill="none" stroke="#ffe9a8" stroke-opacity=".22"
                  stroke-width=".6">RV</text>
          </g>
        </g>
      </svg>
    </button>

  </div>

  <div id="intro-footer">
    <p>La tua presenza renderà questo giorno indimenticabile</p>
  </div>

</div>

<script>
(function(){
  var RATIO = 2/3;               // la cartolina verticale è 400x600
  var screenEl = document.getElementById('envelope-screen');
  var container = document.getElementById('envelope-container');
  var seal = document.getElementById('env-seal');
  var flap = document.getElementById('env-top-flap');
  var letter = document.getElementById('env-letter');
  var cardInner = document.getElementById('card-inner-3d');
  var opened = false, portrait = false;

  var EASE = 'cubic-bezier(.4,0,.2,1)';
  var FULL_TRANSITION =
    'transform 1s ease-in-out, left .9s ' + EASE + ', top .9s ' + EASE +
    ', width .9s ' + EASE + ', height .9s ' + EASE;

  // Dimensione e posizione della cartolina a schermo pieno, in verticale.
  function portraitBox(){
    var pad = window.innerWidth < 480 ? 18 : 28;
    var availH = window.innerHeight - pad * 2;
    var availW = window.innerWidth - pad * 2;
    var h = Math.min(availH, availW / RATIO);
    var w = h * RATIO;
    var rect = container.getBoundingClientRect();
    return {
      w: w,
      h: h,
      left: (window.innerWidth - w) / 2 - rect.left,
      top: (window.innerHeight - h) / 2 - rect.top
    };
  }

  function applyPortrait(animate){
    var box = portraitBox();
    if (!animate) letter.style.transition = 'none';
    letter.style.transform = 'none';
    letter.style.left = box.left + 'px';
    letter.style.top = box.top + 'px';
    letter.style.width = box.w + 'px';
    letter.style.height = box.h + 'px';
    if (!animate){
      void letter.offsetWidth;
      letter.style.transition = FULL_TRANSITION;
    }
  }

  // Passa da "dentro la busta" (in percentuale) a misure fisse, per poterle animare.
  function goPortrait(){
    letter.style.transition = 'none';
    letter.style.left = letter.offsetLeft + 'px';
    letter.style.top = letter.offsetTop + 'px';
    letter.style.width = letter.offsetWidth + 'px';
    letter.style.height = letter.offsetHeight + 'px';
    letter.style.right = 'auto';
    letter.style.bottom = 'auto';
    void letter.offsetWidth;

    letter.style.transition = FULL_TRANSITION;
    container.classList.add('envelope-gone');
    applyPortrait(true);
    portrait = true;
  }

  function openEnvelope(){
    if (opened) return;
    opened = true;

    screenEl.classList.add('is-open');
    container.style.cursor = 'default';

    setTimeout(function(){
      flap.classList.add('flap-open');
      flap.style.filter = 'none';
    }, 300);

    // La cartolina esce dalla busta.
    setTimeout(function(){
      letter.style.zIndex = '40';
      letter.style.transform = 'translateY(-105%) scale(1.02)';
    }, 1000);

    // Si raddrizza in verticale e occupa lo schermo.
    setTimeout(goPortrait, 2100);

    // Si gira e mostra l'invito.
    setTimeout(function(){
      cardInner.style.transform = 'rotateY(180deg)';
    }, 2900);
  }

  seal.addEventListener('click', openEnvelope);
  container.addEventListener('click', openEnvelope);
  container.addEventListener('touchend', function(e){
    if (e.cancelable) e.preventDefault();
    openEnvelope();
  }, {passive:false});

  // Rotazione dello schermo o ridimensionamento: ricalcola senza animazione.
  var t;
  window.addEventListener('resize', function(){
    if (!portrait) return;
    clearTimeout(t);
    t = setTimeout(function(){ applyPortrait(false); }, 120);
  });
})();
</script>

</body>
</html>
