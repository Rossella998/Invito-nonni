<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I nostri 70 anni di matrimonio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --butter-light:#faf3df;
    --butter:#f3e6c4;
    --butter-dark:#e3cc96;
    --butter-deep:#cbb074;
    --gold-light:#fff3a8;
    --gold:#d4af37;
    --gold-dark:#aa7c11;
    --bg:#12100e;
    --pop-scale:1.2;
    --pop-y:-20%;
    --serif:"Playfair Display",Georgia,"Times New Roman",serif;
    --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
    --hand:"Alex Brush","Segoe Script",cursive;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html,body{margin:0;padding:0;height:100%;}

  body{
    background:var(--bg);
    color:#f5f5f4;
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- Schermata ---------- */
  #envelope-screen{
    position:fixed;
    inset:0;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(16px,5vh,40px);
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* dvh dove supportato: evita i salti della barra indirizzi su iOS/Android */
  @supports (height:100dvh){ #envelope-screen{height:100dvh;} }

  .glow{
    position:absolute;
    width:min(24rem,80vw);
    aspect-ratio:1;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
  }
  .glow-a{top:-20%;left:-25%;background:var(--gold-dark);opacity:.2;}
  .glow-b{bottom:-20%;right:-25%;background:var(--butter-deep);opacity:.15;}

  #intro-titles,#intro-footer{
    position:relative;
    z-index:2;
    text-align:center;
    transition:opacity .5s ease;
  }
  #intro-titles h2{
    margin:0 0 .5rem;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.1rem,5.5vw,1.875rem);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-light);
  }
  #intro-titles p{
    margin:0;
    font-size:clamp(.65rem,3vw,.875rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#a8a29e;
  }
  #intro-footer p{
    margin:0;
    font-size:clamp(.65rem,3vw,.75rem);
    font-style:italic;
    color:#a8a29e;
  }

  /* ---------- Busta ---------- */
  #envelope-container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:460px;
    aspect-ratio:46/30;
    perspective:1000px;
    touch-action:manipulation;
  }

  .layer{position:absolute;inset:0;overflow:hidden;}

  .rough-paper{
    background-color:#f7ebd0;
    background-image:
      radial-gradient(rgba(120,90,40,.08) 1px,transparent 0),
      radial-gradient(rgba(0,0,0,.05) 1px,transparent 0);
    background-size:8px 8px,12px 12px;
    background-position:0 0,4px 4px;
  }

  #env-back{
    z-index:0;
    border-radius:10px;
    border:1px solid rgba(227,204,150,.3);
    box-shadow:0 20px 45px rgba(0,0,0,.5);
  }
  #env-back::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(250,243,223,.4),transparent 55%,rgba(203,176,116,.3));
  }

  /* Cartolina */
  #env-letter{
    position:absolute;
    left:4%;
    right:4%;
    top:3.5%;
    bottom:3.5%;
    z-index:5;
    perspective:1200px;
    pointer-events:none;
    transition:transform 1s ease-in-out;
  }
  #card-inner-3d{
    position:relative;
    width:100%;
    height:100%;
    border-radius:10px;
    transform-style:preserve-3d;
    transition:transform 1.2s cubic-bezier(.4,0,.2,1);
    box-shadow:0 18px 35px rgba(0,0,0,.45);
  }
  .card-face{
    position:absolute;
    inset:0;
    border-radius:10px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .card-front{
    background:#fdfbf7;
    border:1px solid rgba(212,175,55,.4);
    color:#292524;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(12px,4%,24px);
    text-align:center;
  }
  .card-front .names{
    margin:0;
    font-family:var(--hand);
    font-size:clamp(1.75rem,9vw,3rem);
    line-height:1.1;
    color:var(--gold-dark);
  }
  .card-front .rule{
    width:4rem;
    height:1px;
    margin:clamp(8px,3%,14px) 0;
    background:rgba(170,124,17,.4);
  }
  .card-front .years{
    margin:0;
    font-family:var(--serif);
    font-size:clamp(.6rem,2.8vw,.875rem);
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#57534e;
  }
  .card-front .kind{
    margin:.5rem 0 0;
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(.6rem,2.6vw,.75rem);
    color:#a8a29e;
  }
  .card-back{
    transform:rotateY(180deg);
    background:#0c0a09;
    border:1px solid rgba(212,175,55,.3);
  }
  .card-back img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* Alette */
  .flap{z-index:10;}
  #flap-left{clip-path:polygon(0 0,52% 50%,0 100%);border-radius:10px 0 0 10px;}
  #flap-left::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(227,204,150,.3),rgba(243,230,196,.1),transparent);border-right:1px solid rgba(0,0,0,.1);}
  #flap-right{clip-path:polygon(100% 0,48% 50%,100% 100%);border-radius:0 10px 10px 0;}
  #flap-right::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(227,204,150,.3),rgba(243,230,196,.1),transparent);border-left:1px solid rgba(0,0,0,.1);}
  #flap-bottom{
    z-index:15;
    clip-path:polygon(0 100%,100% 100%,50% 48%);
    border-radius:0 0 10px 10px;
  }
  #flap-bottom::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(227,204,150,.4),var(--butter),transparent);border-top:1px solid rgba(0,0,0,.05);}

  #env-top-flap{
    z-index:25;
    clip-path:polygon(0 0,100% 0,50% 52%);
    border-radius:10px 10px 0 0;
    transform-origin:top center;
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.25));
  }
  #env-top-flap::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--butter-light),var(--butter),rgba(227,204,150,.5));}

  @keyframes openFlap{
    0%{transform:rotateX(0deg);z-index:25;}
    50%{z-index:25;}
    100%{transform:rotateX(180deg);z-index:5;}
  }
  .flap-open{animation:openFlap 1s cubic-bezier(.4,0,.2,1) forwards;}

  /* ---------- Sigillo: pulsante reale, cliccabile su ogni dispositivo ---------- */
  #env-seal{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    margin:0;
    padding:0;
    border:0;
    background:none;
    font:inherit;
    color:inherit;
    cursor:pointer;
    display:grid;
    place-items:center;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .5s ease,transform .5s cubic-bezier(.175,.885,.32,1.275);
  }
  #env-seal:focus-visible{outline:2px solid var(--gold-light);outline-offset:6px;border-radius:50%;}

  .wax-seal-gold{
    width:clamp(58px,17vw,80px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
    background:radial-gradient(circle at 35% 35%,#fff5c0 0%,var(--gold) 35%,#b8860b 70%,#684803 100%);
    border-radius:48% 52% 47% 53%/52% 46% 54% 48%;
    box-shadow:
      inset 2px 2px 4px rgba(255,255,255,.8),
      inset -3px -4px 6px rgba(0,0,0,.6),
      0 8px 16px rgba(0,0,0,.4);
    transition:transform .4s cubic-bezier(.175,.885,.32,1.275),box-shadow .4s ease;
  }
  .wax-seal-inner{
    width:75%;
    aspect-ratio:1;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:radial-gradient(circle at 65% 65%,#593e02 0%,#a37812 60%,#e6ca65 100%);
    box-shadow:
      inset -2px -2px 4px rgba(255,255,255,.5),
      inset 3px 3px 6px rgba(0,0,0,.7);
  }
  .wax-seal-inner span{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(1rem,4.5vw,1.5rem);
    letter-spacing:-.04em;
    color:var(--gold-light);
    text-shadow:0 2px 2px rgba(0,0,0,.8);
  }

  @media (hover:hover) and (pointer:fine){
    #env-seal:hover .wax-seal-gold{
      transform:scale(1.06) rotate(2deg);
      box-shadow:
        inset 3px 3px 6px rgba(255,255,255,.9),
        inset -4px -5px 8px rgba(0,0,0,.7),
        0 12px 24px rgba(0,0,0,.5);
    }
  }
  /* Feedback al tocco, dato che su mobile :hover non esiste */
  #env-seal:active .wax-seal-gold{transform:scale(.94);}

  /* Piccoli schermi: la cartolina non deve uscire dai bordi quando si ingrandisce */
  @media (max-width:520px){
    :root{--pop-scale:1.04;--pop-y:-12%;}
  }
  /* Schermi bassi (paesaggio su telefono) */
  @media (max-height:520px){
    #envelope-screen{gap:12px;}
    #envelope-container{max-width:min(460px,calc(66vh * 1.53));}
  }

  .is-open #env-seal{opacity:0;transform:translate(-50%,-50%) scale(.4);pointer-events:none;}
  .is-open #intro-titles,.is-open #intro-footer{opacity:0;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>

    <div id="flap-right" class="layer flap rough-paper"></div>
    <div id="flap-bottom" class="layer rough-paper"></div>
    <div id="env-top-flap" class="layer rough-paper"></div>

    <!-- Sigillo in ceralacca -->
    <button type="button" id="env-seal" aria-label="Apri l'invito">
      <span class="wax-seal-gold">
        <span class="wax-seal-inner"><span>RV</span></span>
      </span>
    </button>

  <div id="intro-footer">
    <p>La tua presenza renderà questo giorno indimenticabile</p>
  </div>

</div>

<script>
(function(){
  var screenEl = document.getElementById('envelope-screen');
  var container = document.getElementById('envelope-container');
  var seal = document.getElementById('env-seal');
  var flap = document.getElementById('env-top-flap');
  var letter = document.getElementById('env-letter');
  var cardInner = document.getElementById('card-inner-3d');
  var opened = false;

  function popTransform(){
    var cs = getComputedStyle(document.documentElement);
    var y = cs.getPropertyValue('--pop-y').trim() || '-20%';
    var s = cs.getPropertyValue('--pop-scale').trim() || '1.2';
    return 'translateY(' + y + ') scale(' + s + ')';
  }

  function openEnvelope(){
    if (opened) return;
    opened = true;

    screenEl.classList.add('is-open');
    container.style.cursor = 'default';

    setTimeout(function(){
      flap.classList.add('flap-open');
      flap.style.filter = 'none';
    }, 300);

    setTimeout(function(){
      letter.style.zIndex = '40';
      letter.style.transform = 'translateY(-110%) scale(1.05)';
    }, 1000);

    setTimeout(function(){
      letter.style.transform = popTransform();
      cardInner.style.transform = 'rotateY(180deg)';
    }, 2200);
  }

  // Il sigillo è un <button>: riceve il click su tutti i browser, desktop e mobile.
  seal.addEventListener('click', openEnvelope);
  // Tutta la busta resta toccabile, come nella versione originale.
  container.addEventListener('click', openEnvelope);
  // Rete di sicurezza per i browser mobile che non generano il click su un tap veloce.
  container.addEventListener('touchend', function(e){
    if (e.cancelable) e.preventDefault();
    openEnvelope();
  }, {passive:false});
})();
</script>
